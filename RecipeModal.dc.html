<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>レシピ詳細モーダル｜土の子ファーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.rm-scroll{scrollbar-width:thin;scrollbar-color:#c9b892 transparent}
.rm-scroll::-webkit-scrollbar{width:6px}
.rm-scroll::-webkit-scrollbar-thumb{background:#c9b892;border-radius:3px}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="recipe-modal-title" style="{{ s.card }}">
  <button type="button" onClick="{{ close }}" aria-label="閉じる" style="{{ s.close }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"></path></svg>
  </button>

  <div class="rm-scroll" style="{{ s.scroll }}">
    <!-- 写真 -->
    <div style="position:relative">
      <div style="{{ s.photo }}">
        <img src="{{ recipe.img }}" alt="{{ titleFlat }}" style="{{ imgStyle }}">
      </div>
    </div>

    <!-- 見出し -->
    <span style="{{ s.tag }}">{{ recipe.cat }}</span>
    <h2 id="recipe-modal-title" style="{{ s.title }}">{{ titleFlat }}</h2>
    <p style="{{ s.lead }}">{{ detail.lead }}</p>
    <div style="{{ s.meta }}">
      <span style="display:inline-flex;align-items:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ recipe.time }}
      </span>
      <span style="display:inline-flex;align-items:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path></svg>{{ recipe.serves }}
      </span>
    </div>

    <hr style="{{ s.rule }}">

    <!-- 材料 -->
    <section aria-labelledby="recipe-modal-ing">
      <div style="{{ s.headRow }}">
        <h3 id="recipe-modal-ing" style="{{ s.head }}">材料<span style="{{ s.headSub }}">（{{ recipe.serves }}）</span></h3>
      </div>
      <ul style="{{ s.ingList }}">
        <sc-for list="{{ detail.ingredients }}" as="it" hint-placeholder-count="8">
          <li style="display:flex;align-items:baseline;gap:8px">
            <span style="white-space:nowrap">{{ it.name }}</span>
            <span aria-hidden="true" style="flex:1;min-width:16px;border-bottom:1.5px dotted #c9b892;transform:translateY(-4px)"></span>
            <span style="white-space:nowrap">{{ it.amount }}</span>
          </li>
        </sc-for>
      </ul>
    </section>

    <hr style="{{ s.rule }}">

    <!-- 作り方 -->
    <section aria-labelledby="recipe-modal-steps">
      <div style="{{ s.headRow }}">
        <h3 id="recipe-modal-steps" style="{{ s.head }}">作り方</h3>
      </div>
      <ol style="{{ s.stepList }}">
        <sc-for list="{{ steps }}" as="st" hint-placeholder-count="4">
          <li style="{{ s.step }}">
            <span aria-hidden="true" style="{{ s.stepNum }}">{{ st.n }}</span>
            <span style="white-space:pre-line;padding-top:3px">{{ st.text }}</span>
          </li>
        </sc-for>
      </ol>
    </section>

    <!-- ひとことメモ -->
    <aside aria-label="ひとことメモ" style="{{ s.memo }}">
      <div>
        <h4 style="{{ s.memoHead }}">ひとことメモ</h4>
        <p style="{{ s.memoText }}">{{ detail.memo }}</p>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["pc","sp"],"default":"pc"},"recipe":{"editor":null},"onClose":{"editor":null},"$preview":{"width":770,"height":1560}}'>
